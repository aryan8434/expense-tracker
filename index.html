<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Tracker - Personal Finance Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="container py-4">
        <!-- App Header -->
        <header class="app-header text-center mb-4">
            <div class="app-brand justify-content-center mb-2">
                <div class="brand-icon text-white">
                    <i class="bi bi-wallet2"></i>
                </div>
                <h1 class="brand-title">Expense Tracker</h1>
            </div>
            <p class="brand-subtitle">Effortlessly monitor, organize, and manage your daily expenses</p>
        </header>

        <!-- Analytics Dashboard Stats (Feature 1) -->
        <div class="row justify-content-center mb-4">
            <div class="col-lg-10">
                <div class="row g-3">
                    <!-- Total Spend Card -->
                    <div class="col-md-4">
                        <div class="glass-panel stat-card p-3 d-flex align-items-center gap-3">
                            <div class="stat-icon-wrapper bg-indigo">
                                <i class="bi bi-cash-stack"></i>
                            </div>
                            <div>
                                <span class="stat-label">Total Expenses</span>
                                <h3 class="stat-value text-white mb-0" id="stat-total">$0.00</h3>
                            </div>
                        </div>
                    </div>
                    <!-- Transactions Count Card -->
                    <div class="col-md-4">
                        <div class="glass-panel stat-card p-3 d-flex align-items-center gap-3">
                            <div class="stat-icon-wrapper bg-cyan">
                                <i class="bi bi-receipt"></i>
                            </div>
                            <div>
                                <span class="stat-label">Total Transactions</span>
                                <h3 class="stat-value text-white mb-0" id="stat-count">0</h3>
                            </div>
                        </div>
                    </div>
                    <!-- Average Expense Card -->
                    <div class="col-md-4">
                        <div class="glass-panel stat-card p-3 d-flex align-items-center gap-3">
                            <div class="stat-icon-wrapper bg-emerald">
                                <i class="bi bi-pie-chart"></i>
                            </div>
                            <div>
                                <span class="stat-label">Average Expense</span>
                                <h3 class="stat-value text-white mb-0" id="stat-average">$0.00</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Form Card -->
        <div class="row justify-content-center mb-4">
            <div class="col-lg-10">
                <div class="glass-panel form-card">
                    <h5 class="fw-semibold mb-3 d-flex align-items-center gap-2">
                        <i class="bi bi-plus-circle text-primary"></i>
                        <span>Add New Expense</span>
                    </h5>
                    <form id="expense-form" onsubmit="handleSubmit(event)">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="amount" class="form-label-custom">
                                    <i class="bi bi-currency-dollar"></i> Expense Amount
                                </label>
                                <div class="input-group">
                                    <input type="number" class="form-control input-custom" placeholder="e.g. 50" id="amount" required min="1" step="any" />
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label for="description" class="form-label-custom">
                                    <i class="bi bi-pencil-square"></i> Description
                                </label>
                                <input type="text" class="form-control input-custom" placeholder="e.g. Grocery shopping" id="description" required />
                            </div>
                            <div class="col-md-3">
                                <label for="category" class="form-label-custom">
                                    <i class="bi bi-tag"></i> Category
                                </label>
                                <select class="form-select input-custom" id="category" required>
                                    <option value="food">🍔 Food</option>
                                    <option value="transportation">⛽ Fuel</option>
                                    <option value="entertainment">🎬 Entertainment</option>
                                    <option value="utilities">💡 Utilities</option>
                                    <option value="other">📦 Other</option>
                                </select>
                            </div>
                            <div class="col-12 text-end pt-2">
                                <button type="submit" id="submit-btn" class="btn btn-gradient">
                                    <i class="bi bi-plus-lg"></i>
                                    <span>Add Expense</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Expense List Section -->
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div id="expense-list" class="d-flex flex-column gap-3"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Custom Script -->
    <script src="index.js"></script>
</body>
</html>
